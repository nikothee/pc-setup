################################################################################
### Install packages
### NOTE: this list is intentionally kept minimal. Only things that genuinely
### need to be layered onto the OS image (kernel/driver adjacent tooling,
### things Flatpak/Homebrew/Cargo can't provide, or things needed system-wide
### before those package managers are even available) belong here. Everything
### else should go through homebrew.yml, cargo.yml or flatpaks.yml instead.

- name: "rpm : Install system utilities"
  become: true
  community.general.rpm_ostree_pkg:
    name: "{{ item }}"
    state: present
    apply_live: true
  with_items:
    - clang # clang
    - flatpak-builder # build flatpaks locally
    - gamescope # micro-compositor
    - git-lfs # git LFS
    - ImageMagick-heic # HEIC support for ImageMagick
    - llvm # llvm
    - lldb # llvm (debugger)
    - nodejs # nodejs (needed for sonarqube, needs to be system-wide)
    - openssh-askpass # (enables password prompts for ssh with Yubikey)
    - openssl-devel # openssl development files, needed for building some stuff
    - podman-compose # podman alias for docker compose
    - podman-docker # podman alias for docker
    - powerline # powerline
    - powerline-fonts # powerline
    - rpm-build # rpm build (used for the local wallpaper/font rpms below)
    - rustup # rust toolchain installer (bootstraps cargo, chicken-and-egg)
    - uxplay # AirPlay server
    - vim-powerline # powerline
    - zenity # zenity (dialogs)
    - zsh # zsh

- name: "rpm : Install multimedia dependencies & codecs"
  become: true
  community.general.rpm_ostree_pkg:
    name: "{{ item }}"
    state: present
  with_items:
    - lame # lame (mp3) audio codec
    - gstreamer1-vaapi # video acceleration (VAAPI)

- name: "rpm : Install applications"
  become: true
  community.general.rpm_ostree_pkg:
    name: "{{ item }}"
    state: present
  with_items:
    - code # Visual Studio Code
    - steam-devices # udev rules for Steam controllers (Steam itself is a Flatpak now)

################################################################################
### NOTE: the following used to be layered rpm-ostree packages and have since
### moved to other package managers, kept here for reference:
###   - ansible, fastfetch, gh, glab, google-cloud-cli(-*), helm, kind,
###     kubernetes, yq            -> Homebrew (see homebrew.yml)
###   - Cider, solaar, steam      -> Flatpak (see flatpaks.yml)
###   - k3s-selinux               -> no longer used, k8s tooling is client-only now
